name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debugger:
    name: Debugger (${{ matrix.os }})
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            runner: macos-26-intel
            rid: osx-x64
          - os: windows-latest
            rid: win-x64

    steps:
      - name: Configure byte-preserving checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Python for portable contracts
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install portable contract dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv build/contract-python
          build/contract-python/bin/python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r tests/DncDbg.RemoteTests/requirements.txt
          build/contract-python/bin/python -m pip check

      - name: Verify native runner matches the artifact RID
        shell: pwsh
        run: |
          $expected = "${{ matrix.rid }}".Split('-')[-1]
          $process = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          $hostArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($process -ne $expected -or $hostArchitecture -ne $expected) {
            throw "Runner/process architecture must match $expected; got host=$hostArchitecture process=$process."
          }

      - name: Restore
        run: dotnet restore DncDbg.slnx

      - name: Build
        run: dotnet build DncDbg.slnx --configuration Release --no-restore --nologo

      - name: Publish adapter
        run: dotnet publish src/DncDbg.Dap --configuration Release --no-build --output bin --nologo

      - name: Assert desktop artifacts exclude target-native assets and test hooks
        shell: pwsh
        run: |
          $python = if ($IsWindows) { "python" } else { "python3" }
          & $python tests/DncDbg.RemoteTests/assert_artifacts.py bin src/DncDbg.Dap/bin/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check remote transport and desktop breakpoint proof
        shell: pwsh
        run: |
          dotnet run --project tests/DncDbg.RemoteTests --configuration Release --no-build -- --desktop tests/RemoteBreakpointApp/bin/Release/net10.0/RemoteBreakpointApp.dll tests/RemoteBreakpointApp/Program.cs build/validation/remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check neutral manifest, structured command and SSH contracts
        run: dotnet run --project tests/DncDbg.RemoteTests --configuration Release --no-build -- --target-contracts

      - name: Check native target ownership contracts (no mobile runtime)
        if: runner.os != 'Windows'
        env:
          DNCDBG_PYTHON: ${{ github.workspace }}/build/contract-python/bin/python
        run: dotnet run --project tests/DncDbg.MobileTests --configuration Release --no-build -- --platform contracts --output build/validation/mobile-contracts

      - name: Upload portable mobile contract evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-contracts-${{ matrix.rid }}
          path: build/validation/mobile-contracts/evidence/
          retention-days: 7
          if-no-files-found: error

      - name: Run smoke and acceptance tests
        shell: pwsh
        run: |
          $adapter = if ($IsWindows) {
            Join-Path $PWD "bin/dncdbg-dap.exe"
          } else {
            Join-Path $PWD "bin/dncdbg-dap"
          }
          $env:DNCDBG = $adapter
          dotnet run --project tests/DncDbg.SmokeTests --configuration Release --no-build -- $adapter
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ./test-suite/run_tests.ps1

      - name: Upload adapter artifact
        uses: actions/upload-artifact@v4
        with:
          name: dncdbg-${{ matrix.rid }}
          path: bin/
          if-no-files-found: error

  docker:
    name: Docker integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DNCDBG_DOCKER_TEST_RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run Docker integration tests (Docker required)
        run: dotnet run --project tests/DncDbg.DockerTests --configuration Release -- --require-docker

      - name: Upload native-host architecture proof from Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-native-host-docker
          path: build/validation/native-host-docker/
          retention-days: 7
          if-no-files-found: error

      - name: Clean up this run's Docker resources
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -eu
          containers="$(timeout 15s docker container ls --all --quiet --filter "label=org.dncdbg.docker-tests=$DNCDBG_DOCKER_TEST_RUN")"
          if [ -n "$containers" ]; then
            printf '%s\n' "$containers" | xargs -r timeout 30s docker container rm --force
          fi
          images="$(timeout 15s docker image ls --quiet --filter "label=org.dncdbg.docker-tests=$DNCDBG_DOCKER_TEST_RUN")"
          if [ -n "$images" ]; then
            printf '%s\n' "$images" | xargs -r timeout 30s docker image rm --force
          fi
          timeout 15s rm -rf build/docker-tests

  vscode:
    name: VS Code integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure byte-preserving checkout
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/DncDbg.VsCodeTests/package-lock.json

      - name: Publish adapter
        run: dotnet publish src/DncDbg.Dap --configuration Release --output bin --nologo

      - name: Assert desktop package isolation
        run: python3 tests/DncDbg.RemoteTests/assert_artifacts.py bin

      - name: Install VS Code test dependencies
        run: npm ci --prefix tests/DncDbg.VsCodeTests

      - name: Run VS Code integration tests
        run: xvfb-run -a npm test --prefix tests/DncDbg.VsCodeTests
        env:
          DNCDBG_VSCODE_VERSION: stable
