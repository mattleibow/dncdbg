name: Evaluator lifecycle parity

on:
  pull_request:
    branches: [main]
    paths:
      - src/DncDbg.Engine/**
      - tests/DncDbg.SmokeTests/**
      - test-suite/TestCrossThreadEvaluation/**
      - .github/workflows/evaluation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize immutable native references and pre-fix managed baseline
        run: |
          set -euo pipefail
          root=build/validation/evaluation
          mkdir -p "$root/context"/{historical,current,baseline} "$root/evidence"
          git fetch --no-tags https://github.com/viewizard/dncdbg.git 6bae41f9aa579dd2556ede7094e430e53eb64423
          git archive fc643dfcdf8feec45d2700ce6466774323b3032b | tar -x -C "$root/context/historical"
          git archive 6bae41f9aa579dd2556ede7094e430e53eb64423 | tar -x -C "$root/context/current"
          git archive 96b6d67f956d58d8104dae373dbcb446f97ec8df | tar -x -C "$root/context/baseline"
          git rev-parse HEAD > "$root/evidence/head.txt"
          printf '%s\n' fc643dfcdf8feec45d2700ce6466774323b3032b 6bae41f9aa579dd2556ede7094e430e53eb64423 96b6d67f956d58d8104dae373dbcb446f97ec8df > "$root/evidence/references.txt"
          docker build -f tests/DncDbg.SmokeTests/Evaluation.Dockerfile \
            -t dncdbg-evaluation:${{ github.run_id }} "$root/context" 2>&1 | tee "$root/evidence/build.log"
      - name: Native first, deterministic managed red, repeated green and full suites
        run: |
          set -euo pipefail
          docker run --rm --cpus 2 --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            --mount "type=bind,src=$PWD,dst=/workspace/source" \
            dncdbg-evaluation:${{ github.run_id }} bash -euo pipefail -c '
              evidence=/workspace/source/build/validation/evaluation/evidence
              git config --global --add safe.directory /workspace/source
              dotnet --info > "$evidence/runtime.txt"
              sha256sum /usr/share/dotnet/shared/Microsoft.NETCore.App/10.0.14/lib{coreclr,mscordbi,mscordaccore}.so /opt/native-{historical,current}/* > "$evidence/runtime-native.sha256"
              cp /opt/evaluation-packages.txt "$evidence/packages.txt"
              yes > /dev/null & load1=$!
              yes > /dev/null & load2=$!
              trap "kill $load1 $load2; wait $load1 $load2 || true" EXIT
              for round in 1 2 3 4 5; do
                export TMPDIR=$(mktemp -d /tmp/er.XXXXXX)
                DNCDBG=/opt/native-historical/dncdbg pwsh ./test-suite/run_tests.ps1 TestCrossThreadEvaluation TestVariables > "$evidence/native-$round.log" 2>&1
                grep -q "RUNTIME .NET 10.0.14" "$evidence/native-$round.log"
                echo "Historical native focused/unchanged round $round: PASS"
              done
              kill "$load1" "$load2"; wait "$load1" "$load2" || true
              trap - EXIT
              export TMPDIR=$(mktemp -d /tmp/er.XXXXXX)
              if DNCDBG=/opt/managed-baseline/dncdbg-dap pwsh ./test-suite/run_tests.ps1 TestCrossThreadEvaluation > "$evidence/managed-red.log" 2>&1; then
                echo "Pre-fix managed baseline unexpectedly passed"; exit 1
              fi
              grep -q "earlier evaluation could not be interrupted" "$evidence/managed-red.log"
              echo "Deterministic pre-fix managed red: CONFIRMED"
              dotnet publish src/DncDbg.Dap -c Release -o /opt/managed-current --nologo -v:q > "$evidence/managed-build.log" 2>&1
              dotnet build tests/DncDbg.SmokeTests -c Release --nologo -v:q >> "$evidence/managed-build.log" 2>&1
              export TMPDIR=$(mktemp -d /tmp/sv.XXXXXX)
              dotnet run --project tests/DncDbg.SmokeTests -c Release --no-build -- --server-checks /opt/native-current/dncdbg > "$evidence/native-server.log" 2>&1
              tail -1 "$evidence/native-server.log"
              server_red_ref=96b6d67f956d58d8104dae373dbcb446f97ec8df
              server_main_ref=dab33c9f2f05739417276223f623d27d9c6cd335
              {
                printf "CI historical server-red reference: %s\n" "$server_red_ref"
                printf "Local exact main server-red reference: %s\n" "$server_main_ref"
                for path in src/DncDbg.Dap/CommandLine.cs src/DncDbg.Dap/Program.cs; do
                  red_blob=$(git rev-parse "$server_red_ref:$path")
                  main_blob=$(git rev-parse "$server_main_ref:$path")
                  printf "%s historical=%s main=%s\n" "$path" "$red_blob" "$main_blob"
                  if [ "$red_blob" != "$main_blob" ]; then
                    echo "Historical and exact main server sources differ: $path" >&2; exit 1
                  fi
                done
              } > "$evidence/server-references.txt"
              export TMPDIR=$(mktemp -d /tmp/sv.XXXXXX)
              if dotnet run --project tests/DncDbg.SmokeTests -c Release --no-build -- --server-checks /opt/managed-baseline/dncdbg-dap > "$evidence/managed-server-red.log" 2>&1; then
                echo "Historical managed server baseline unexpectedly passed"; exit 1
              fi
              grep -q "Server exited before accepting port.*Address already in use" "$evidence/managed-server-red.log"
              echo "Deterministic historical managed server ordering red: CONFIRMED"
              export TMPDIR=$(mktemp -d /tmp/sv.XXXXXX)
              dotnet run --project tests/DncDbg.SmokeTests -c Release --no-build -- --server-checks /opt/managed-current/dncdbg-dap > "$evidence/managed-server-green.log" 2>&1
              tail -1 "$evidence/managed-server-green.log"
              dotnet run --project tests/DncDbg.SmokeTests -c Release --no-build -- --evaluation > "$evidence/callback-green.log" 2>&1
              yes > /dev/null & load1=$!
              yes > /dev/null & load2=$!
              trap "kill $load1 $load2; wait $load1 $load2 || true" EXIT
              for round in 1 2 3 4 5; do
                export TMPDIR=$(mktemp -d /tmp/er.XXXXXX)
                export DNCDBG_LOG_DIR="$evidence/managed-$round-traces"
                DNCDBG=/opt/managed-current/dncdbg-dap pwsh ./test-suite/run_tests.ps1 TestCrossThreadEvaluation TestVariables > "$evidence/managed-$round.log" 2>&1
                grep -q "RUNTIME .NET 10.0.14" "$evidence/managed-$round.log"
                echo "Managed focused/unchanged round $round: PASS"
              done
              kill "$load1" "$load2"; wait "$load1" "$load2" || true
              trap - EXIT
              unset DNCDBG_LOG_DIR
              for provider in native managed; do
                adapter=/opt/native-current/dncdbg
                if [ "$provider" = managed ]; then adapter=/opt/managed-current/dncdbg-dap; fi
                export TMPDIR=$(mktemp -d /tmp/er.XXXXXX)
                DNCDBG="$adapter" pwsh ./test-suite/run_tests.ps1 > "$evidence/$provider-full.log" 2>&1
                tail -1 "$evidence/$provider-full.log"
              done
              export TMPDIR=$(mktemp -d /tmp/er.XXXXXX)
              dotnet run --project tests/DncDbg.SmokeTests -c Release --no-build -- /opt/managed-current/dncdbg-dap > "$evidence/smoke.log" 2>&1
              tail -1 "$evidence/smoke.log"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluator-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: build/validation/evaluation/evidence/
          if-no-files-found: error
          retention-days: 14
