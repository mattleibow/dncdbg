name: Native DAP backend integration

on:
  push:
    branches: [main, mattleibow-mixed-mode-debugging]
    paths:
      - src/**
      - tests/DncDbg.MixedModeTests/**
      - tests/DncDbg.SmokeTests/**
      - test-suite/**
      - .github/workflows/mixed-mode-proof.yml
      - global.json
      - DncDbg.slnx
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-backend:
    name: Native backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Find public native DAP toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/validation/mixed-mode | Out-Null
          dotnet --info | Tee-Object build/validation/mixed-mode/dotnet-info.txt
          $lldb = $null
          if ($IsMacOS) {
            $lldb = & xcrun --find lldb-dap
            if ($LASTEXITCODE) { throw "The selected public Xcode toolchain has no lldb-dap." }
          } elseif ($IsWindows) {
            $candidate = Join-Path $env:ProgramFiles "LLVM/bin/lldb-dap.exe"
            if (Test-Path $candidate) { $lldb = $candidate }
            if (-not $lldb) {
              $tool = Get-Command lldb-dap -ErrorAction SilentlyContinue
              if ($tool) { $lldb = $tool.Source }
            }
            if (-not $lldb) {
              choco install llvm --yes --no-progress
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              $lldb = $candidate
            }
          } else {
            foreach ($name in @("lldb-dap", "lldb-dap-21", "lldb-dap-20", "lldb-dap-19", "lldb-dap-18")) {
              $tool = Get-Command $name -ErrorAction SilentlyContinue
              if ($tool) { $lldb = $tool.Source; break }
            }
            if (-not $lldb) {
              sudo apt-get update -qq
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              sudo apt-get install --yes lldb-18
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              $lldb = (Get-Command lldb-dap-18).Source
            }
          }
          if (-not (Test-Path $lldb)) { throw "Native DAP adapter not found: $lldb" }
          & $lldb --version | Tee-Object build/validation/mixed-mode/lldb-version.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "LLDB_DAP=$lldb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and validate swappable DAP contracts
        shell: pwsh
        run: |
          dotnet publish src/DncDbg.Dap -c Release -o bin --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $adapter = if ($IsWindows) { "bin/dncdbg-dap.exe" } else { "bin/dncdbg-dap" }
          python tests/DncDbg.MixedModeTests/proxy_contracts.py --adapter $adapter 2>&1 |
            Tee-Object build/validation/mixed-mode/backend-contracts.log
          exit $LASTEXITCODE
      - name: Validate LLDB execution and read-only CoreCLR overlay
        shell: pwsh
        run: |
          $adapter = if ($IsWindows) { "bin/dncdbg-dap.exe" } else { "bin/dncdbg-dap" }
          python tests/DncDbg.MixedModeTests/native_proxy.py --adapter $adapter --lldb-dap $env:LLDB_DAP 2>&1 |
            Tee-Object build/validation/mixed-mode/native-proxy.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/DncDbg.MixedModeTests/proxy_contracts.py --adapter $adapter --lldb-dap $env:LLDB_DAP 2>&1 |
            Tee-Object build/validation/mixed-mode/native-failures.log
          exit $LASTEXITCODE
      - name: Verify unchanged managed debugger regressions
        shell: pwsh
        run: |
          $adapter = if ($IsWindows) { "bin/dncdbg-dap.exe" } else { "bin/dncdbg-dap" }
          dotnet run --project tests/DncDbg.SmokeTests -c Release -- $adapter 2>&1 |
            Tee-Object build/validation/mixed-mode/managed-smoke.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $regressionLog = Join-Path $PWD "build/validation/mixed-mode/managed-regressions.log"
          & ./test-suite/run_tests.ps1 TestBreakpoint TestStackTrace TestThreads TestStepping TestAttach TestDisconnect 2>&1 |
            Tee-Object $regressionLog
          exit $LASTEXITCODE
      - name: Preserve logs and fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dap-${{ matrix.os }}
          path: build/validation/mixed-mode/
          retention-days: 14

  retired-windows-research:
    name: Retired raw Windows API research (not production)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run preserved public raw Windows evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/validation/mixed-mode | Out-Null
          dotnet build tests/DncDbg.MixedModeTests/fixture/Fixture.csproj -o build/validation/mixed-mode/fixture --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tests/DncDbg.MixedModeTests/fixture -B build/validation/mixed-mode/native -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/validation/mixed-mode/native --config Debug
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/validation/mixed-mode/native/Debug/mixedfixture.* build/validation/mixed-mode/fixture/
          foreach ($mode in @("", "--attach", "--terminate-native")) {
            $arguments = @("run", "--project", "tests/DncDbg.MixedModeTests/WindowsProof", "--",
              "build/validation/mixed-mode/fixture/Fixture.dll", "tests/DncDbg.MixedModeTests/fixture")
            if ($mode) { $arguments += $mode }
            dotnet @arguments 2>&1 | Tee-Object -Append build/validation/mixed-mode/retired-windows-research.log
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-windows-research
          path: build/validation/mixed-mode/
          retention-days: 14
