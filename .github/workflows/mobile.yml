name: Mobile proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Mobile iOS simulator (pinned)
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/build/mobile-sdk
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.401
            11.0.100-rc.1.26425.128
      - name: Install exact workload and DevFlow CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-tools build/workload-scratch
          cd tests/DncDbg.MauiTestApp
          dotnet workload install maui-ios --version 11.0.100-rc.1.26460.1 --temp-dir ../../build/workload-scratch
          cd ../..
          dotnet tool install Microsoft.Maui.Cli --version 0.1.0-preview.12.26421.1 --tool-path build/mobile-tools
          echo "$PWD/build/mobile-tools" >> "$GITHUB_PATH"
      - name: Build, provision and prove exact iOS simulator tuple
        run: >-
          dotnet run --project tests/DncDbg.MobileTests -c Release --
          --platform ios --xcode-dir /Applications/Xcode_26.6.app/Contents/Developer
          --output build/validation/mobile-ci/ios
      - name: Recover owned simulator and processes even after cancellation
        if: always() && hashFiles('build/validation/mobile-ci/ios/state.json') != ''
        timeout-minutes: 3
        run: >-
          dotnet run --project tests/DncDbg.MobileTests -c Release --no-build --
          --platform ios --xcode-dir /Applications/Xcode_26.6.app/Contents/Developer
          --output build/validation/mobile-ci/ios --cleanup
      - name: Upload bounded iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/mobile-ci/ios/evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  android:
    name: Mobile Android emulator (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/build/mobile-sdk
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.401
            11.0.100-rc.1.26425.128
      - name: Enable hosted KVM (required; no software-emulation fallback)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/validation/android-provision
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-dncdbg-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          stat /dev/kvm | tee build/validation/android-provision/kvm.log
          test -r /dev/kvm && test -w /dev/kvm
      - name: Provision pinned SDK image using official Android CLI only
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Hosted image must expose the Android SDK}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p build/validation/android-provision
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$manager" --licenses > build/validation/android-provision/licenses.log
          "$manager" --channel=0 --install \
            "cmdline-tools;21.0" "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            "ndk;29.0.14206865" "emulator" \
            "system-images;android-37.1;google_apis_ps16k;x86_64" \
            > build/validation/android-provision/sdkmanager.log 2>&1
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Install exact workload and DevFlow CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-tools build/workload-scratch
          cd tests/DncDbg.MauiTestApp
          dotnet workload install maui-android --version 11.0.100-rc.1.26460.1 --temp-dir ../../build/workload-scratch
          cd ../..
          dotnet tool install Microsoft.Maui.Cli --version 0.1.0-preview.12.26421.1 --tool-path build/mobile-tools
          echo "$PWD/build/mobile-tools" >> "$GITHUB_PATH"
      - name: Build and prove exact Android x64 emulator tuple
        run: >-
          dotnet run --project tests/DncDbg.MobileTests -c Release --
          --platform android --android-abi x86_64 --output build/validation/mobile-ci/android
      - name: Recover owned emulator, forwards and processes even after cancellation
        if: always() && hashFiles('build/validation/mobile-ci/android/state.json') != ''
        timeout-minutes: 3
        run: >-
          dotnet run --project tests/DncDbg.MobileTests -c Release --no-build --
          --platform android --android-abi x86_64 --output build/validation/mobile-ci/android --cleanup
      - name: Upload bounded Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/validation/mobile-ci/android/evidence/
            build/validation/android-provision/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
