name: Windows detach ownership

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-detach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert and record the exact reviewed source head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw "Checked-out source differs from the requested head." }
          New-Item -ItemType Directory -Force build/validation/windows-detach | Out-Null
          $actual | Set-Content -Encoding utf8 build/validation/windows-detach/source-head.txt
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build exact-source fixture and provider
        run: dotnet build tests/DncDbg.RemoteTests -c Release --nologo
      - name: Record runtime and enable bounded Windows crash evidence
        shell: pwsh
        run: |
          $output = Join-Path $PWD "build/validation/windows-detach"
          $dumps = New-Item -ItemType Directory -Force "$output/dumps"
          dotnet --info | Set-Content "$output/dotnet-info.txt"
          dotnet --list-runtimes | Set-Content "$output/runtimes.txt"
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\dotnet.exe"
          New-Item -Force $key | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps.FullName -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 8 -PropertyType DWord -Force | Out-Null
          Get-ChildItem "C:/Program Files (x86)/Windows Kits" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName | Set-Content "$output/cdb-paths.txt"
      - name: Reproduce pristine main without lifecycle instrumentation
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $baseline = "fb668b7c1c3a94ebb4bcd09ad6eb881efa0e783a"
          git fetch --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/windows-detach-baseline | Out-Null
          git archive --format=tar --output=build/windows-detach-baseline.tar $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/windows-detach-baseline.tar -C build/windows-detach-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Join-Path $PWD "build/validation/windows-detach/pristine-main"
          New-Item -ItemType Directory -Force $output | Out-Null
          Push-Location build/windows-detach-baseline
          try {
            dotnet build tests/DncDbg.RemoteTests -c Release --nologo 2>&1 | Tee-Object "$output/build.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project tests/DncDbg.RemoteTests -c Release --no-build -- --desktop tests/RemoteBreakpointApp/bin/Release/net10.0/RemoteBreakpointApp.dll tests/RemoteBreakpointApp/Program.cs $output 2>&1 | Tee-Object "$output/proof.log"
            exit $LASTEXITCODE
          } finally { Pop-Location }
      - name: Capture the exact original PR21 failure without source changes
        if: always() && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $baseline = "cdb360c2533e8b1ec81c6769bac76fef394f262f"
          git fetch --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/windows-detach-original | Out-Null
          git archive --format=tar --output=build/windows-detach-original.tar $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/windows-detach-original.tar -C build/windows-detach-original
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Join-Path $PWD "build/validation/windows-detach/original-pr21"
          New-Item -ItemType Directory -Force $output | Out-Null
          Push-Location build/windows-detach-original
          try {
            dotnet build tests/DncDbg.RemoteTests -c Release --nologo 2>&1 | Tee-Object "$output/build.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $failed = 0
            0..2 | ForEach-Object {
              $case = New-Item -ItemType Directory -Force "$output/case-$_"
              dotnet run --project tests/DncDbg.RemoteTests -c Release --no-build -- --desktop tests/RemoteBreakpointApp/bin/Release/net10.0/RemoteBreakpointApp.dll tests/RemoteBreakpointApp/Program.cs $case.FullName 2>&1 | Tee-Object "$case/proof.log"
              if ($LASTEXITCODE -ne 0) { $failed++ }
            }
            if ($failed -ne 0) { throw "$failed of 3 exact original PR21 witnesses failed; every failure is retained." }
          } finally { Pop-Location }
      - name: Reproduce unchanged desktop assertions in isolated processes
        if: always()
        shell: pwsh
        run: |
          $failed = 0
          0..2 | ForEach-Object {
            $output = "build/validation/windows-detach/focused-$_"
            New-Item -ItemType Directory -Force $output | Out-Null
            dotnet run --project tests/DncDbg.RemoteTests -c Release --no-build -- --desktop-only tests/RemoteBreakpointApp/bin/Release/net10.0/RemoteBreakpointApp.dll tests/RemoteBreakpointApp/Program.cs $output 2>&1 | Tee-Object "$output/proof.log"
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -ne 0) { throw "$failed of 3 unchanged focused desktop proofs failed; every failure is retained." }
      - name: Prove stopped detach and correctly owned pre/post-detach I/O
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/validation/windows-detach | Out-Null
          dotnet run --project tests/DncDbg.RemoteTests -c Release --no-build -- --detach-io tests/RemoteBreakpointApp/bin/Release/net10.0/RemoteBreakpointApp.dll tests/RemoteBreakpointApp/Program.cs build/validation/windows-detach 2>&1 | Tee-Object build/validation/windows-detach/proof.log
          exit $LASTEXITCODE
      - name: Verify the full unchanged transport inspection and disconnect assertions
        if: always()
        shell: pwsh
        run: |
          dotnet run --project tests/DncDbg.RemoteTests -c Release --no-build -- --desktop tests/RemoteBreakpointApp/bin/Release/net10.0/RemoteBreakpointApp.dll tests/RemoteBreakpointApp/Program.cs build/validation/windows-detach/desktop 2>&1 | Tee-Object build/validation/windows-detach/desktop.log
          exit $LASTEXITCODE
      - name: Preserve Windows crash events and dump stacks
        if: always()
        shell: pwsh
        run: |
          $output = Join-Path $PWD "build/validation/windows-detach"
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -in 1000,1001,1026 } |
            Select-Object TimeCreated,Id,ProviderName,Message |
            ConvertTo-Json -Depth 4 | Set-Content "$output/crash-events.json"
          $cdb = Get-Content "$output/cdb-paths.txt" | Where-Object { $_ -match '/x64/|\\x64\\' } | Select-Object -First 1
          if ($cdb) {
            Get-ChildItem "$output/dumps" -Filter *.dmp | ForEach-Object {
              & $cdb -z $_.FullName -c ".symfix; .reload; !analyze -v; ~* k; q" 2>&1 |
                Set-Content "$($_.FullName).stack.txt"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-detach-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/windows-detach/
          if-no-files-found: error
          retention-days: 7
